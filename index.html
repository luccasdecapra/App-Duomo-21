essoa quer que seja marcado.","Alinhe com cozinha e bar o gesto (sobremesa com vela, escrita no prato, um espumante).","Escolha o momento certo — nunca no meio de um prato principal ou de uma conversa íntima.","Reconheça com elegância, sem transformar em espetáculo que constranja.","Registre a preferência para uma próxima visita, se for cliente recorrente."],"frasi":[["Soubemos que hoje é uma ocasião especial. Podemos prepará-los uma pequena surpresa?","Abbiamo saputo che oggi è un'occasione speciale. Possiamo prepararvi una piccola sorpresa?","We heard today is a special occasion. May we prepare a little surprise for you?","Supimos que hoy es una ocasión especial. ¿Podemos prepararles una pequeña sorpresa?"]],"erro":"Anunciar em voz alta sem confirmar antes. Nem todo mundo quer os holofotes."},{"id":"conta-preco","t":"Cliente reclama do preço ou da conta","sit":"Na hora da conta, o cliente questiona um valor, um couvert, ou acha caro.","passos":["Ouça até o fim, sem interromper e sem se defender.","Confira a conta com calma e discrição, longe da atenção das outras mesas.","Se houver erro, corrija na hora e peça desculpa. Se não houver, explique o item com clareza, sem tom acusatório.","Trate qualquer divergência sem insinuar má-fé do cliente.","Se estiver além do seu limite, envolva o responsável em vez de dizer não sozinho."],"frasi":[["Deixe-me verificar isto com o senhor, com calma.","Mi permetta di verificarlo con lei, con calma.","Let me go through this with you, calmly.","Permítame revisarlo con usted, con calma."],["Tem razão, houve um engano. Corrijo já.","Ha ragione, c'è stato un errore. Correggo subito.","You're right, there was a mistake. I'll fix it now.","Tiene razón, hubo un error. Lo corrijo ya."]],"erro":"Defender a conta na frente de todos ou insinuar que o cliente está tentando levar vantagem."},{"id":"foto-vista","t":"Cliente quer a vista e as fotos","sit":"No rooftop, clientes querem fotografar a vista do Duomo, às vezes bloqueando passagem ou outras mesas.","passos":["Trate o desejo como legítimo — a vista é parte do que eles vieram viver.","Ofereça ajuda proativa: tirar a foto por eles, indicar o melhor ângulo e horário (pôr do sol).","Redirecione com gentileza se estiverem bloqueando serviço ou outra mesa, oferecendo um ponto melhor.","Proteja a experiência das outras mesas ao mesmo tempo."],"frasi":[["Querem que eu tire uma foto de vocês com o Duomo atrás?","Volete che vi faccia una foto con il Duomo alle spalle?","Would you like me to take a photo of you with the Duomo behind?","¿Quieren que les tome una foto con el Duomo detrás?"],["O melhor momento para a vista é ao pôr do sol — posso avisá-los.","Il momento migliore per la vista è al tramonto — posso avvisarvi.","The best moment for the view is at sunset — I can let you know.","El mejor momento para la vista es al atardecer — puedo avisarles."]],"erro":"Tratar o pedido de foto como estorvo. Para o turista, a foto é metade da experiência."},{"id":"evento-atrasa","t":"Evento privado que atrasa o giro","sit":"Um evento ou mesa grande reservada se estende além do horário, e há reservas seguintes esperando.","passos":["Antecipe: monitore o horário e comunique-se com o grupo antes de estourar o tempo, com elegância.","Prepare a mesa seguinte com um plano B (bar, outra mesa) caso o atraso seja inevitável.","Comunique quem espera com honestidade e uma previsão realista, antes que reclamem.","Nunca pressione o grupo que está saindo de forma que a experiência deles termine mal — o giro não vale o dano.","Registre para o próximo evento: o tempo real vs. o contratado."],"frasi":[["Estamos preparando a sua mesa; peço só mais alguns minutos e ofereço-lhes um aperitivo enquanto isso.","Stiamo preparando il vostro tavolo; vi chiedo ancora qualche minuto e vi offro un aperitivo nel frattempo.","We're preparing your table; may I ask a few more minutes and offer you an aperitif meanwhile?","Estamos preparando su mesa; les pido unos minutos más y les ofrezco un aperitivo mientras tanto."]],"erro":"Deixar a mesa seguinte sem informação, ou apressar o grupo que sai de forma ríspida. Os dois lados saem insatisfeitos."},{"id":"alergia-nao-avisada","t":"Alergia revelada tarde demais","sit":"O cliente menciona uma alergia grave só depois do prato já estar à mesa, ou já ter começado a comer.","passos":["Aja com calma mas com prioridade absoluta — segurança vem antes de tudo.","Retire o prato imediatamente e confirme com a cozinha o que continha.","Se o cliente já ingeriu e há qualquer sinal de reação, acione ajuda sem hesitar; siga o protocolo da casa.","Prepare uma alternativa segura, confirmada item a item com a cozinha.","Registre o ocorrido — é segurança alimentar, não só serviço."],"frasi":[["Por segurança, retiro o prato agora e confirmo tudo com a cozinha antes de trazer outra coisa.","Per sicurezza, ritiro subito il piatto e confermo tutto con la cucina prima di portarle altro.","For your safety, I'll take the dish away now and confirm everything with the kitchen before bringing anything else.","Por seguridad, retiro el plato ahora y confirmo todo con la cocina antes de traerle otra cosa."]],"erro":"Minimizar a alergia ou tentar 'só tirar o ingrediente'. Alergia não é preferência — é segurança, e não se improvisa."}]};
const FRASI = {"id":"frasi","nome":"Frases para Clientes","sub":"O que dizer, em quatro idiomas","intro":"Frases prontas, calibradas para hospitalidade de alto padrão. Toque numa frase para ver os quatro idiomas. O tom certo importa mais que a tradução literal: em italiano prefira o 'Lei' (formal); em espanhol, 'usted'.","grupos":[{"t":"Acolhimento e chegada","f":[["Boa noite, sejam bem-vindos. Têm reserva?","Buonasera, benvenuti. Avete una prenotazione?","Good evening, welcome. Do you have a reservation?","Buenas noches, bienvenidos. ¿Tienen reserva?"],["Boa noite, já os vi. Chego num instante.","Buonasera, vi ho visti. Arrivo subito da voi.","Good evening, I've seen you. I'll be right with you.","Buenas noches, ya los vi. Enseguida estoy con ustedes."],["É a primeira vez que nos visitam?","È la prima volta che venite da noi?","Is this your first time with us?","¿Es la primera vez que nos visitan?"],["Deixem-me acompanhá-los até a mesa.","Permettetemi di accompagnarvi al tavolo.","Allow me to show you to your table.","Permítanme acompañarlos a la mesa."],["Posso guardar seus casacos?","Posso prendere i vostri cappotti?","May I take your coats?","¿Puedo guardar sus abrigos?"],["Preferem uma mesa com vista para o Duomo?","Preferite un tavolo con vista sul Duomo?","Would you prefer a table with a view of the Duomo?","¿Prefieren una mesa con vista al Duomo?"]]},{"t":"Tomar o pedido","f":[["Posso ajudar com o menu ou responder alguma dúvida?","Posso aiutarvi con il menù o rispondere a qualche domanda?","May I help you with the menu or answer any questions?","¿Puedo ayudarles con el menú o resolver alguna duda?"],["Já escolheram ou desejam mais um instante?","Avete già scelto o desiderate ancora un momento?","Have you decided, or would you like a moment more?","¿Ya eligieron o desean un momento más?"],["Posso recomendar algo, se me disserem o que preferem.","Posso consigliarvi qualcosa, se mi dite cosa preferite.","I can recommend something if you tell me what you enjoy.","Puedo recomendarles algo si me dicen qué prefieren."],["Só para confirmar: … Está correto?","Solo per confermare: … È corretto?","Just to confirm: … Is that correct?","Solo para confirmar: … ¿Es correcto?"],["Alguma alergia ou restrição alimentar que eu deva saber?","Avete allergie o intolleranze che devo comunicare?","Any allergies or dietary restrictions I should know about?","¿Alguna alergia o restricción alimentaria que deba saber?"],["Excelente escolha. Combina muito bem com …","Ottima scelta. Si abbina molto bene con …","Excellent choice. It pairs beautifully with …","Excelente elección. Marida muy bien con …"]]},{"t":"Durante a refeição","f":[["Como está tudo? Posso trazer mais alguma coisa?","Come sta andando? Posso portarvi qualcos'altro?","How is everything? May I bring you anything else?","¿Cómo está todo? ¿Puedo traerles algo más?"],["Permitem que retire?","Permettete che sparecchi?","May I clear this for you?","¿Me permiten retirar?"],["Mais água? Com ou sem gás?","Ancora acqua? Naturale o frizzante?","More water? Still or sparkling?","¿Más agua? ¿Con o sin gas?"],["Deixo-os à vontade e volto em breve.","Vi lascio con calma e torno a breve.","I'll leave you to it and come back shortly.","Los dejo con calma y regreso enseguida."]]},{"t":"Demora e indisponibilidade","f":[["Peço desculpa pela espera. Verifico pessoalmente e volto em cinco minutos.","Mi dispiace per l'attesa. Verifico personalmente e torno tra cinque minuti.","I'm sorry about the wait. I'll check personally and come back in five minutes.","Disculpen la espera. Lo verifico personalmente y vuelvo en cinco minutos."],["O prato está em preparo; prevemos ainda cerca de … minutos.","Il piatto è in preparazione; prevediamo ancora circa … minuti.","The dish is being prepared; we expect about … minutes more.","El plato se está preparando; calculamos unos … minutos más."],["Hoje não está disponível; posso sugerir duas alternativas?","Oggi non è disponibile; posso suggerirvi due alternative?","It isn't available today; may I suggest two alternatives?","Hoy no está disponible; ¿puedo sugerir dos alternativas?"],["O que podemos fazer é …","Quello che possiamo fare è …","What we can do is …","Lo que podemos hacer es …"],["Prefiro confirmar com a cozinha para dar-lhe uma informação precisa.","Preferisco verificare con la cucina per darvi un'informazione precisa.","I'd rather confirm with the kitchen to give you accurate information.","Prefiero confirmar con la cocina para darles información precisa."]]},{"t":"Alergias e segurança","f":[["Por segurança, confirmo isto imediatamente com a cozinha.","Per sicurezza, confermo subito con la cucina.","For your safety, I'll confirm this with the kitchen right away.","Por seguridad, lo confirmo de inmediato con la cocina."],["Este prato contém …; prefere que eu sugira uma alternativa segura?","Questo piatto contiene …; preferite che suggerisca un'alternativa sicura?","This dish contains …; would you like me to suggest a safe alternative?","Este plato contiene …; ¿desean que sugiera una alternativa segura?"],["Registrei a alergia e vou acompanhá-la até a entrega.","Ho annotato l'allergia e la seguirò fino al servizio.","I've noted the allergy and will follow it through to service.","He anotado la alergia y la seguiré hasta el servicio."]]},{"t":"Reclamações e desculpas","f":[["Compreendo o incômodo. Eu cuido disto pessoalmente e mantenho-o informado.","Capisco il disagio. Me ne occupo io personalmente e la tengo aggiornata.","I understand the inconvenience. I'll take care of this personally and keep you updated.","Entiendo la molestia. Me ocupo yo personalmente y le mantengo informado."],["Peço desculpa. Deixe-me corrigir isto agora mesmo.","Mi scuso. Mi permetta di rimediare subito.","I'm sorry. Let me put this right straight away.","Le pido disculpas. Permítame corregirlo ahora mismo."],["Tem toda a razão em apontar isso. Obrigado por dizer-me.","Ha perfettamente ragione a farmelo notare. Grazie di avermelo detto.","You're quite right to point that out. Thank you for telling me.","Tiene toda la razón en señalarlo. Gracias por decírmelo."],["Como podemos resolver isto da melhor forma para o senhor?","Come possiamo risolverlo al meglio per lei?","How can we best resolve this for you?","¿Cómo podemos resolverlo de la mejor manera para usted?"],["Lamento muito. Isto não é o nosso padrão.","Mi dispiace davvero. Questo non è il nostro standard.","I'm truly sorry. This isn't our standard.","Lo lamento mucho. Esto no es nuestro estándar."]]},{"t":"A conta e a despedida","f":[["Trago a conta assim que desejarem, sem pressa.","Vi porto il conto quando desiderate, con calma.","I'll bring the bill whenever you're ready, no rush.","Les traigo la cuenta cuando gusten, sin prisa."],["Foi um prazer recebê-los. Tenham uma excelente noite.","È stato un piacere avervi con noi. Vi auguro una buona serata.","It was a pleasure to have you. Have a wonderful evening.","Fue un placer recibirlos. Que tengan una excelente noche."],["Esperamos revê-los em breve.","Speriamo di rivedervi presto.","We hope to see you again soon.","Esperamos volver a verlos pronto."],["Posso ajudar com um táxi ou indicações?","Posso aiutarvi con un taxi o delle indicazioni?","May I help you with a taxi or directions?","¿Puedo ayudarles con un taxi o indicaciones?"]]},{"t":"Mentalidade concierge — o entorno","f":[["Com prazer indico-lhe algo perto daqui.","Con piacere le indico qualcosa qui vicino.","I'd be glad to recommend something nearby.","Con gusto le recomiendo algo cerca de aquí."],["Se me der um instante, verifico os horários e volto.","Se mi dà un istante, verifico gli orari e torno.","Give me a moment and I'll check the times and come back.","Si me da un momento, verifico los horarios y vuelvo."],["Posso reservar para o senhor, se desejar.","Posso prenotare per lei, se desidera.","I can make a reservation for you, if you'd like.","Puedo reservar para usted, si lo desea."]]}]};
const OGGI = {
  t: "Checklist do dia",
  s: "Rotina do responsável de sala, fora do índice dos livros",
  b: [
["n","REGRA DE CONTROLE","Primeira volta: identificar. Depois: delegar. Segunda volta: confirmar. Mandar fazer sem conferir novamente não é controle; é suposição."],
["c","A. Leitura da operação",["Ver todas as reservas, horários e número de pessoas","Identificar mesas grandes, VIPs, recorrentes e ocasiões especiais","Ler observações sobre alergias, acessibilidade, crianças e pedidos","Verificar conflitos de mesa, atrasos, alterações e overbooking","Confirmar indisponibilidades e duas alternativas para cada falta"]],
["c","B. Ambiente e atmosfera",["Luzes: sala, entrada, corredores, lounges e banheiros","Nenhuma lâmpada apagada, piscando ou com tonalidade errada","Música: sistema, playlist, volume e equilíbrio entre áreas","Temperatura, climatização, cheiro e circulação de ar","Terraço: vento, chuva, piso, aquecedores, guarda-sóis, alternativa interna"]],
["c","C. Inspeção dos lounges",["Lounge 1 controlado","Lounge 2 controlado","Lounge 3 controlado","Lounge 4 controlado","Lounge 5 controlado"]],
["p","Em cada área: mesas, sofás, cadeiras, almofadas, piso, cinzeiros, cardápios, iluminação, passagem e ausência de objetos esquecidos. Nenhuma área é considerada pronta por suposição."],
["c","D. Mise en place",["Sala, mesas e cadeiras alinhadas; estações limpas","Guardanapos de serviço e de cliente em quantidade","Pratos limpos nas estações corretas","Talheres limpos, polidos, separados, em quantidade","Copos e taças polidos, sem marcas, sem odor, sem danos","Bandejas, abridores, saca-rolhas, canetas, blocos, baldes de gelo","POS, impressoras, comandas e canais de comunicação testados"]],
["c","E. Estoque e reposição",["Patatine carregadas","Olive carregadas","Taralli carregados","Pane carregado","Acqua naturale e frizzante carregadas","Gelo e acompanhamentos controlados"]],
["c","F. Banheiros",["Piso, vaso, pia e espelho limpos; lixeiras vazias","Papel higiênico, sabonete e papel para mãos disponíveis","Torneiras, descargas, secadores e iluminação funcionando","Cheiro adequado e responsável pelas verificações definido"]],
["c","G. Delegação e segunda volta",["Cada falha tem uma pessoa responsável por corrigi-la","Cada tarefa recebeu prazo claro, anterior à abertura","Todas as correções verificadas pessoalmente na segunda volta","Praças, funções, intervalos, apoio e mesas grandes definidos","Uniforme, higiene, ferramentas e postura da equipe controlados"]],
["h","Briefing de cinco minutos"],
["ol",["Hoje: volume previsto, horários críticos e perfil das reservas.","Produto: indisponibilidades, novidades, recomendações e tempos.","Segurança: alergias, riscos, clima e pontos de atenção.","Pessoas: praças, papéis, apoio e escalonamento.","Padrão do dia: um comportamento específico a observar."]],
["c","Durante o serviço",["Toda chegada é reconhecida imediatamente","Nenhuma mesa fica sem dono claro","Ninguém corre, grita ou cria aglomeração em sala","Máximo de dois funcionários em conversa visível, por poucos segundos","Indisponibilidades e atrasos comunicados antes da reclamação","Pedidos pendentes têm responsável e prazo","Alergias confirmadas e acompanhadas até a entrega","Ritmo das praças equilibrado; apoio deslocado antes do colapso","Entrada, banheiros, estações, piso e ambiente dentro do padrão","Reclamações registradas, assumidas e fechadas","Equipe com olhos na sala, mãos disponíveis, postura correta"]],
["c","Encerramento",["Solicitações e reclamações concluídas ou formalmente transferidas","Erros de conta, atrasos, devoluções e compensações registrados","Quebras, faltas e manutenção comunicadas com responsável e prazo","Preferências de clientes recorrentes registradas","A equipe recebeu um reconhecimento específico e uma correção objetiva","O turno seguinte recebeu handover completo"]]
]
};

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ---------- checklist persistente ---------- */
const CHIAVE="biblia_terrazza_progresso";
const oggiData=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let fatti=new Set();
try{const s=JSON.parse(localStorage.getItem(CHIAVE)||"null");if(s&&s.data===oggiData())fatti=new Set(s.voci);}catch(e){}
function salva(){try{localStorage.setItem(CHIAVE,JSON.stringify({data:oggiData(),voci:[...fatti]}))}catch(e){}}

/* ---------- índice: categorias ---------- */
$("#indice-c").innerHTML =
  '<a class="idx-home" href="#inizio"><i>◆</i>Início</a>' +
  CATEGORIE.map((c,i)=>
    '<a href="#cat/'+c.id+'"><span class="idx-n">'+String(i+1).padStart(2,"0")+'</span>'+
    '<span class="idx-t">'+esc(c.nome)+'<em>'+esc(c.sub)+'</em></span></a>'
  ).join("");

/* ---------- render de blocos (capítulos) ---------- */
function bloco(b,ci){
  const [t]=b;
  if(t==="p")  return "<p>"+esc(b[1])+"</p>";
  if(t==="h")  return "<h3>"+esc(b[1])+"</h3>";
  if(t==="ul") return '<ul class="lista">'+b[1].map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>";
  if(t==="ol") return '<ol class="lista">'+b[1].map(x=>"<li>"+esc(x)+"</li>").join("")+"</ol>";
  if(t==="n")  return '<div class="nota"><div class="nota__t">'+esc(b[1])+'</div><p>'+esc(b[2])+"</p></div>";
  if(t==="r")  return '<div class="nota rossa"><div class="nota__t">'+esc(b[1])+'</div><p>'+esc(b[2])+"</p></div>";
  if(t==="e")  return b[1].map(r=>'<div class="coppia"><div class="no">'+esc(r[0])+'</div><div class="si">'+esc(r[1])+"</div></div>").join("");
  if(t==="t"){
    const cols=b[1],cl=cols.length===3?"c3":"c2";
    let h='<div class="tab"><div class="riga '+cl+'">'+cols.map(c=>'<div class="h">'+esc(c)+"</div>").join("")+"</div>";
    h+=b[2].map(r=>'<div class="riga '+cl+'"><div class="k">'+esc(r[0])+"</div>"+r.slice(1).map(v=>'<div class="v">'+esc(v)+"</div>").join("")+"</div>").join("");
    return h+"</div>";
  }
  if(t==="c"){
    const key=ci+"|"+b[1];
    const dataFmt=new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
    let h='<div class="check" data-k="'+esc(key)+'"><div class="check__t">'+esc(b[1])+' <span class="check__data">· hoje, '+dataFmt+'</span></div>';
    h+=b[2].map((x,i)=>{const id=key+"|"+i,on=fatti.has(id);
      return '<button class="ck'+(on?" fatto":"")+'" data-id="'+esc(id)+'" aria-pressed="'+on+'"><span class="ck__q"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span><span class="ck__l">'+esc(x)+"</span></button>";}).join("");
    return h+'<button class="azzera" data-azzera="'+esc(key)+'">Limpar esta lista</button></div>';
  }
  return "";
}

/* ---------- frontespizio ---------- */
function frontespizio(){
  return '<section class="front">'+
    '<div class="front__casa">TERRAZZA DUOMO 21 &nbsp;·&nbsp; MILANO</div>'+
    '<h1 class="front__t">La<em>Bibbia</em></h1>'+
    '<div class="front__r"></div>'+
    '<p class="front__p">O cliente não deve sentir o esforço, a confusão ou o conflito dos bastidores. Deve sentir presença, clareza, ritmo e cuidado.</p>'+
    '<div class="front__meta">MANUAL DA SALA &nbsp;·&nbsp; VERSÃO 4.0</div>'+
    '<div class="front__cats">'+CATEGORIE.map(c=>'<a href="#cat/'+c.id+'">'+esc(c.nome)+'</a>').join("")+'</div>'+
  "</section>";
}

/* ---------- render de uma categoria ---------- */
function renderCat(cat){
  let h='<p class="cap__n">CATEGORIA</p><h2 class="cap__t">'+esc(cat.nome)+'</h2><p class="cap__s">'+esc(cat.sub)+'</p><div class="cap__r"></div>';
  if(cat.tipo==="capitoli"){
    // lista de capítulos como cartões que abrem
    h+='<div class="cardlist">'+cat.capitoli.map(c=>
      '<a class="cardc" href="#cap/'+c.id+'"><span class="cardc__t">'+esc(c.t)+'</span><span class="cardc__go">›</span></a>'
    ).join("")+'</div>';
  } else if(cat.tipo==="scenari"){
    h+='<p class="intro">'+esc(SCENARI.intro)+'</p>';
    h+='<div class="cardlist">'+SCENARI.lista.map(s=>
      '<a class="cardc" href="#sce/'+s.id+'"><span class="cardc__t">'+esc(s.t)+'</span><span class="cardc__go">›</span></a>'
    ).join("")+'</div>';
  } else if(cat.tipo==="frasi"){
    h+='<p class="intro">'+esc(FRASI.intro)+'</p>';
    h+=FRASI.grupos.map((g,gi)=>renderGruppoFrasi(g,gi)).join("");
  }
  return h;
}

/* ---------- render de um capítulo ---------- */
function renderCap(cap, cat){
  let h='<p class="cap__n">'+esc(cat?cat.nome.toUpperCase():"")+'</p><h2 class="cap__t">'+esc(cap.t)+'</h2>';
  if(cap.s) h+='<p class="cap__s">'+esc(cap.s)+'</p>';
  h+='<div class="cap__r"></div>';
  h+=cap.b.map(b=>bloco(b,cap.id)).join("");
  return h;
}

/* ---------- render de cenário ---------- */
const LANG=["🇧🇷","🇮🇹","🇬🇧","🇪🇸"];
const LANGN=["Português","Italiano","English","Español"];
function renderFrase(linha){
  return '<div class="frase">'+linha.map((txt,i)=>
    '<div class="frase__l"><span class="frase__b">'+LANGN[i].slice(0,2).toUpperCase()+'</span><span class="frase__t">'+esc(txt)+'</span></div>'
  ).join("")+'</div>';
}
function renderScenario(s){
  let h='<p class="cap__n">CENÁRIO</p><h2 class="cap__t">'+esc(s.t)+'</h2><div class="cap__r"></div>';
  h+='<div class="nota"><div class="nota__t">A SITUAÇÃO</div><p>'+esc(s.sit)+'</p></div>';
  h+='<h3>O caminho</h3><ol class="lista">'+s.passos.map(p=>"<li>"+esc(p)+"</li>").join("")+"</ol>";
  if(s.frasi&&s.frasi.length){h+='<h3>O que dizer</h3>'+s.frasi.map(renderFrase).join("");}
  if(s.erro){h+='<div class="nota rossa"><div class="nota__t">O ERRO A EVITAR</div><p>'+esc(s.erro)+'</p></div>';}
  return h;
}

/* ---------- render grupo de frases ---------- */
function renderGruppoFrasi(g,gi){
  let h='<h3>'+esc(g.t)+'</h3>';
  h+=g.f.map(renderFrase).join("");
  return h;
}

/* ---------- roteamento ---------- */
function findCap(id){for(const c of CATEGORIE){if(c.tipo==="capitoli"){const f=c.capitoli.find(x=>x.id===id);if(f)return {cap:f,cat:c};}}return null;}

function mostra(hash){
  const lettura=$("#lettura");
  let titolo="<b>La Bibbia</b>";
  if(!hash||hash==="inizio"){
    lettura.innerHTML=frontespizio();
  } else if(hash==="hoje"){
    let h='<p class="cap__n">FORA DAS CATEGORIAS</p><h2 class="cap__t">'+esc(OGGI.t)+'</h2><p class="cap__s">'+esc(OGGI.s)+'</p><div class="cap__r"></div>';
    h+=OGGI.b.map(b=>bloco(b,"hoje")).join("");
    lettura.innerHTML=h; titolo="<b>Checklist</b> do dia";
  } else if(hash.indexOf("cat/")===0){
    const cat=CATEGORIE.find(c=>c.id===hash.slice(4));
    if(!cat){location.hash="#inizio";return;}
    lettura.innerHTML=renderCat(cat); titolo="<b>"+esc(cat.nome)+"</b>";
  } else if(hash.indexOf("cap/")===0){
    const r=findCap(hash.slice(4));
    if(!r){location.hash="#inizio";return;}
    lettura.innerHTML=renderCap(r.cap,r.cat)+piede(r.cat,r.cap); titolo="<b>"+esc(r.cat.nome)+"</b> · "+esc(r.cap.t);
  } else if(hash.indexOf("sce/")===0){
    const s=SCENARI.lista.find(x=>x.id===hash.slice(4));
    if(!s){location.hash="#cat/scenari";return;}
    lettura.innerHTML=renderScenario(s)+'<nav class="piede"><a href="#cat/scenari"><span>VOLTAR</span>Todos os cenários</a></nav>';
    titolo="<b>Cenário</b> · "+esc(s.t);
  } else { location.hash="#inizio"; return; }
  $("#dove").innerHTML=titolo;
  document.querySelectorAll("#indice a").forEach(a=>{const hh=a.getAttribute("href").slice(1);a.classList.toggle("qui",hh===hash);});
  $("#oggi-b").classList.toggle("attivo",hash==="hoje");
  window.scrollTo(0,0); chiudi();
}
function piede(cat,cap){
  const arr=cat.capitoli, i=arr.findIndex(x=>x.id===cap.id);
  let h='<nav class="piede">';
  if(i>0) h+='<a href="#cap/'+arr[i-1].id+'"><span>ANTERIOR</span>'+esc(arr[i-1].t)+"</a>";
  h+='<a href="#cat/'+cat.id+'" style="text-align:center;flex:0 0 auto">↑</a>';
  if(i<arr.length-1) h+='<a class="fine" href="#cap/'+arr[i+1].id+'"><span>SEGUINTE</span>'+esc(arr[i+1].t)+"</a>";
  return h+"</nav>";
}

/* ---------- índice abre/fecha ---------- */
function apri(){$("#indice").classList.add("on");$("#velo").classList.add("on")}
function chiudi(){$("#indice").classList.remove("on");$("#velo").classList.remove("on")}
$("#apri").onclick=()=>$("#indice").classList.contains("on")?chiudi():apri();
$("#velo").onclick=chiudi;
$("#oggi-b").onclick=()=>{location.hash="#hoje"};

/* ---------- checklist toggles ---------- */
document.addEventListener("click",e=>{
  const ck=e.target.closest(".ck");
  if(ck){const id=ck.dataset.id;
    if(fatti.has(id)){fatti.delete(id);ck.classList.remove("fatto");ck.setAttribute("aria-pressed","false");}
    else{fatti.add(id);ck.classList.add("fatto");ck.setAttribute("aria-pressed","true");}
    salva();return;}
  const az=e.target.closest("[data-azzera]");
  if(az){const k=az.dataset.azzera;[...fatti].forEach(x=>{if(x.indexOf(k+"|")===0)fatti.delete(x);});
    az.closest(".check").querySelectorAll(".ck").forEach(b=>{b.classList.remove("fatto");b.setAttribute("aria-pressed","false");});salva();}
});

/* ---------- busca multilíngue ---------- */
const IDX=[];
// capítulos
CATEGORIE.forEach(cat=>{
  if(cat.tipo==="capitoli") cat.capitoli.forEach(cap=>{
    cap.b.forEach(b=>{const s=testoBloco(b);if(s)IDX.push({tipo:"cap",href:"#cap/"+cap.id,rif:cat.nome+" · "+cap.t,s});});
  });
});
// cenários
SCENARI.lista.forEach(s=>{
  const txt=[s.t,s.sit,s.passos.join(" · "),s.erro||""].join(" · ");
  IDX.push({tipo:"sce",href:"#sce/"+s.id,rif:"Cenário · "+s.t,s:txt});
  (s.frasi||[]).forEach(l=>IDX.push({tipo:"sce",href:"#sce/"+s.id,rif:"Cenário · "+s.t,s:l.join("  ·  ")}));
});
// frases (todos os idiomas juntos p/ busca multilíngue)
FRASI.grupos.forEach(g=>g.f.forEach(l=>{
  IDX.push({tipo:"frase",href:"#cat/frasi",rif:"Frase · "+g.t,s:l.join("  ·  ")});
}));
// checklist
OGGI.b.forEach(b=>{const s=testoBloco(b);if(s)IDX.push({tipo:"oggi",href:"#hoje",rif:"Checklist do dia",s});});

function testoBloco(b){const[t]=b;
  if(t==="p"||t==="h")return b[1];
  if(t==="ul"||t==="ol")return b[1].join(" · ");
  if(t==="n"||t==="r")return b[1]+" — "+b[2];
  if(t==="e")return b[1].map(r=>r.join(" → ")).join(" · ");
  if(t==="t")return b[2].map(r=>r.join(" — ")).join(" · ");
  if(t==="c")return b[1]+" — "+b[2].join(" · ");
  return "";}

function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
$("#cerca-b").onclick=()=>{$("#ricerca").classList.add("on");$("#q").focus();};
$("#chiudi-c").onclick=()=>$("#ricerca").classList.remove("on");
$("#q").addEventListener("input",e=>{
  const q=norm(e.target.value.trim());const out=$("#esiti");
  if(q.length<2){out.innerHTML='<div class="vuoto">Escreva ao menos duas letras. A busca funciona em português, italiano, inglês e espanhol.</div>';return;}
  const r=IDX.filter(x=>norm(x.s).includes(q)).slice(0,80);
  if(!r.length){out.innerHTML='<div class="vuoto">Nada encontrado.</div>';return;}
  out.innerHTML=r.map(x=>{
    const sn=norm(x.s),i=sn.indexOf(q),a=Math.max(0,i-45);
    const frag=(a>0?"…":"")+esc(x.s.slice(a,i))+"<mark>"+esc(x.s.substr(i,e.target.value.trim().length))+"</mark>"+esc(x.s.slice(i+q.length,i+q.length+120))+"…";
    return '<a class="esito" href="'+x.href+'" data-chiudi><b>'+esc(x.rif)+"</b><span>"+frag+"</span></a>";
  }).join("");
});
$("#esiti").addEventListener("click",e=>{if(e.target.closest("[data-chiudi]"))$("#ricerca").classList.remove("on");});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#ricerca").classList.remove("on");chiudi();}});

window.addEventListener("hashchange",()=>mostra(location.hash.slice(1)));
mostra(location.hash.slice(1));
})();
</script>
